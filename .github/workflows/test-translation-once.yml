name: Test translation helper once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CPU model runtime
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Install local translation model dependencies
        run: python3 -m pip install --disable-pip-version-check 'transformers==4.57.1' 'sentencepiece==0.2.1' 'sacremoses==0.1.1' 'polib==1.2.0'
      - name: Translate sample locally
        run: echo 'Helper retained temporarily for manual review only.'

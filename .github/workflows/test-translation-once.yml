name: Test translation helper once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: read

jobs:
  translate-sample:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install translation helper
        run: python3 -m pip install --disable-pip-version-check 'deep-translator==1.11.4' 'polib==1.2.0'
      - name: Translate sample
        shell: bash
        run: |
          python3 - <<'PY'
          import polib
          from deep_translator import GoogleTranslator
          pot=polib.pofile('tools/current-source.pot')
          rows=[e.msgid for e in pot if any(ch in e.msgid for ch in 'äöüÄÖÜß') or any(w in e.msgid for w in ('Vermiet','Kaution','Buchung','Abholung','Rückgabe','Miet'))]
          tr=GoogleTranslator(source='de', target='en')
          for s in rows[:20]:
              print('DE:', s)
              print('EN:', tr.translate(s))
          PY

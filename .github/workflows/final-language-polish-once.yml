name: Final rental language polish once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install language tooling
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check polib
          curl -sSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar i18n make-pot --help >/dev/null
      - name: Rewrite reviewed source strings
        shell: bash
        run: |
          cp languages/patsch9-rental-engine-de_DE.po /tmp/old-de_DE.po
          python3 tools/final-language-polish.py rewrite-source
      - name: Rebuild language catalogues
        shell: bash
        run: |
          php /tmp/wp-cli.phar i18n make-pot . languages/patsch9-rental-engine.pot \
            --domain=patsch9-rental-engine \
            --exclude=.git,.github,tools,tests,languages
          python3 tools/final-language-polish.py rebuild-po --old-po /tmp/old-de_DE.po
          python3 tools/final-language-polish.py audit-pot
          python3 tests/check-translations.py
      - name: Syntax checks
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './tools/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Remove one-off helper and commit
        shell: bash
        run: |
          git rm .github/workflows/final-language-polish-once.yml tools/final-language-polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes patsch9-rental-engine.php languages tests
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: finalize English source strings and German translation"
          git push

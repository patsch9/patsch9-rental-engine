name: Apply rental language polish once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0
      - name: Install PO tooling
        run: python3 -m pip install --disable-pip-version-check 'polib==1.2.0'
      - name: Apply reviewed source wording
        run: python3 tools/polish-i18n.py
      - name: Generate final POT
        run: wp i18n make-pot . languages/patsch9-rental-engine.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages
      - name: Preserve German translations against polished source
        run: python3 tools/rebuild-polished-po.py
      - name: Compile German MO
        run: wp i18n make-mo languages/patsch9-rental-engine-de_DE.po languages/patsch9-rental-engine-de_DE.mo
      - name: Validate translations and syntax
        shell: bash
        run: |
          wp i18n make-pot . /tmp/rmwc.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages
          wp i18n make-mo languages/patsch9-rental-engine-de_DE.po /tmp/rmwc.mo
          python3 tests/check-translations.py --pot /tmp/rmwc.pot --mo /tmp/rmwc.mo
          find . -type f -name '*.php' -not -path './tools/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Commit polished source and catalogues
        shell: bash
        run: |
          git add .
          if git diff --cached --quiet; then
            echo 'No language polish changes.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: polish rental translations and remaining UI strings"
          git push

name: Apply remaining rental i18n once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0
      - name: Validate one-off helper syntax
        shell: bash
        run: |
          python3 -m py_compile tools/wrap-raw-i18n.py tools/fix-remaining-js-i18n.py tools/build-translation-map.py tools/build-german-catalog.py
          php -l tools/rewrite-gettext.php
      - name: Wrap remaining PHP UI strings
        run: python3 tools/wrap-raw-i18n.py
      - name: Localize remaining JavaScript UI strings
        run: python3 tools/fix-remaining-js-i18n.py
      - name: Extract wrapped source catalogue
        run: wp i18n make-pot . tools/current-source.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages
      - name: Install CPU translation runtime
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Install translation tooling
        run: python3 -m pip install --disable-pip-version-check 'transformers==4.57.1' 'sentencepiece==0.2.1' 'sacremoses==0.1.1' 'polib==1.2.0'
      - name: Translate newly wrapped German source strings to English
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python3 tools/build-translation-map.py
      - name: Rewrite gettext source literals
        run: php tools/rewrite-gettext.php tools/de-en-map.json
      - name: Regenerate final English POT
        run: wp i18n make-pot . languages/patsch9-rental-engine.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages
      - name: Update complete German catalogue without replacing existing translations
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python3 tools/build-german-catalog.py
      - name: Compile German MO
        run: wp i18n make-mo languages/patsch9-rental-engine-de_DE.po languages/patsch9-rental-engine-de_DE.mo
      - name: Validate catalogues and syntax
        shell: bash
        run: |
          wp i18n make-pot . /tmp/rmwc.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages
          wp i18n make-mo languages/patsch9-rental-engine-de_DE.po /tmp/rmwc.mo
          python3 tests/check-translations.py --pot /tmp/rmwc.pot --mo /tmp/rmwc.mo
          find . -type f -name '*.php' -not -path './tools/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Commit completed i18n pass
        shell: bash
        run: |
          git add .
          if git diff --cached --quiet; then
            echo 'No i18n changes.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: internationalize remaining rental UI strings [i18n-pass2]"
          git push

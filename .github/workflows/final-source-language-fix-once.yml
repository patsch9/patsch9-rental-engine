name: Final source-language fix once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply exact reviewed replacements
        run: python3 tools/final-source-language-fix.py
      - name: Verify source language and translations
        shell: bash
        run: |
          python3 tests/check-source-language.py
          python3 tests/check-translations.py
      - name: Syntax checks
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './tools/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Remove one-off helper and commit
        shell: bash
        run: |
          git rm .github/workflows/final-source-language-fix-once.yml tools/final-source-language-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes tests
          git commit -m "fix: finish English source-language cleanup"
          git push

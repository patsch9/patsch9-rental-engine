        if ( $this->is_rental( $product_id ) ) {
            return $product_id;
        }
        if ( $variation_id ) {
            $variation = wc_get_product( $variation_id );
            if ( $variation && $variation->is_type( 'variation' ) && $this->is_rental( $variation->get_parent_id() ) ) {

name: Apply rental i18n refactor once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate helper syntax
        shell: bash
        run: |
          python3 -m py_compile tools/build-translation-map.py tools/build-german-catalog.py tools/apply-js-i18n.py
          php -l tools/rewrite-gettext.php

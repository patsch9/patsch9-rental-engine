name: Generate source POT once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0
      - name: Generate source POT
        run: wp i18n make-pot . /tmp/current-source.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tools,tests,languages

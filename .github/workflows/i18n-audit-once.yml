name: One-off i18n audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract i18n candidates
        run: python3 tools/i18n-audit.py
      - name: Show audit summary
        run: python3 -c "import json; d=json.load(open('tools/i18n-candidates.json')); print(d['candidate_occurrences'], d['unique_candidate_values'])"

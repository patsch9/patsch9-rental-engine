name: Run review cleanup

on:
  push:
    branches:
      - fix/plugin-check-2026-10-06

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/plugin-check-2026-10-06
      - name: Run reviewed cleanup script
        shell: python
        run: |
          from pathlib import Path

          helper = Path('.github/workflows/fix-review-warnings.yml')
          text = helper.read_text(encoding='utf-8')
          start_marker = "      - name: Apply targeted review cleanup\n        shell: python\n        run: |\n"
          end_marker = "      - name: Commit cleanup\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line:
                  lines.append('')
              else:
                  raise SystemExit(f'Unexpected YAML indentation: {line!r}')
          script = '\n'.join(lines) + '\n'
          old = "    2,\n)\nreplace_once(\n    core,\n    \"        $selected_raw"
          new = "    3,\n)\nreplace_once(\n    core,\n    \"        $selected_raw"
          if script.count(old) != 1:
              raise SystemExit('Expected delivery call-count assertion not found exactly once.')
          script = script.replace(old, new, 1)
          exec(compile(script, 'review-cleanup.py', 'exec'), {'__name__': '__main__'})
          runner = Path('.github/workflows/run-review-cleanup.yml')
          if runner.exists():
              runner.unlink()
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden request handling and document intentional DB access"
          git push origin HEAD:fix/plugin-check-2026-10-06

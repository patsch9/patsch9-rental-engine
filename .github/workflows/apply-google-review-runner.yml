name: Apply review fix patch

on:
  push:
    branches:
      - fix/google-review-2026-11-03

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/google-review-2026-11-03
      - name: Apply patch and run syntax checks
        shell: bash
        run: |
          cp .github/workflows/static-checks.yml /tmp/static-checks.yml
          : > patch-error.log
          status=0
          echo '== patch ==' >> patch-error.log
          python3 tools/apply-google-review-fixes.py >> patch-error.log 2>&1 || status=$?
          cp /tmp/static-checks.yml .github/workflows/static-checks.yml
          if [ "$status" -eq 0 ]; then
            echo '== php lint ==' >> patch-error.log
            find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >> patch-error.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '== admin js ==' >> patch-error.log
            node --check assets/admin.js >> patch-error.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '== rental js ==' >> patch-error.log
            node --check assets/rental.js >> patch-error.log 2>&1 || status=$?
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$status" -ne 0 ]; then
            git add -A
            git commit -m 'chore: preserve failed review patch for diagnosis' || true
            git push origin HEAD:fix/google-review-2026-11-03
            exit "$status"
          fi

          rm -f patch-error.log tools/apply-google-review-fixes.py
          git add -A
          git commit -m 'fix: address rental engine review findings'
          git push origin HEAD:fix/google-review-2026-11-03

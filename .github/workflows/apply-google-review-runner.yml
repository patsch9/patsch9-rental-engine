name: Apply review fix patch

on:
  push:
    branches:
      - fix/google-review-2026-11-03

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/google-review-2026-11-03
      - name: Apply patch and run syntax checks
        shell: bash
        run: |
          set +e
          python3 tools/apply-google-review-fixes.py > patch-error.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add patch-error.log
            git commit -m 'chore: capture review patch failure' || true
            git push origin HEAD:fix/google-review-2026-11-03
            exit "$status"
          fi
          rm -f patch-error.log tools/apply-google-review-fixes.py
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/admin.js
          node --check assets/rental.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address rental engine review findings'
          git push origin HEAD:fix/google-review-2026-11-03

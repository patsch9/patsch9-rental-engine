name: Apply review fix patch

on:
  push:
    branches:
      - fix/google-review-2026-11-03

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/google-review-2026-11-03
      - name: Extract and apply patch
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/apply-google-review-fixes.yml | sed '1d;$d;s/^          //' > /tmp/apply-google-review-fixes.py
          python3 /tmp/apply-google-review-fixes.py
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/admin.js
          node --check assets/rental.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patsch9-rental-engine.php includes assets uninstall.php tests .github/workflows/static-checks.yml
          git commit -m 'fix: address rental engine review findings'
          git push origin HEAD:fix/google-review-2026-11-03

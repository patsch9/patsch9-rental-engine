name: Apply 2026.10.3 review hardening

on:
  push:
    branches:
      - fix/2026.10.3-review-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/2026.10.3-review-hardening
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0
      - name: Apply exact reviewed patch
        run: |
          python3 tests/repair-2026-10-3-patcher.py
          python3 tests/apply-2026-10-3.py
      - name: Syntax and source-language checks
        shell: bash
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/rental.js
          python3 tests/check-source-language.py
      - name: Refresh gettext catalogs
        shell: bash
        run: |
          wp i18n make-pot . languages/patsch9-rental-engine.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tests
          wp i18n update-po languages/patsch9-rental-engine.pot languages/patsch9-rental-engine-de_DE.po
          python3 tests/refresh-2026-10-3-translations.py
          wp i18n make-mo languages/patsch9-rental-engine-de_DE.po languages/patsch9-rental-engine-de_DE.mo
          wp i18n make-pot . /tmp/rmwc-source.pot --domain=patsch9-rental-engine --slug=patsch9-rental-engine --exclude=.github,tests
          wp i18n make-mo languages/patsch9-rental-engine-de_DE.po /tmp/rmwc-de_DE.mo
          python3 tests/check-translations.py --pot /tmp/rmwc-source.pot --mo /tmp/rmwc-de_DE.mo
      - name: Commit production patch and remove helpers
        shell: bash
        run: |
          rm -f tests/apply-2026-10-3.py tests/repair-2026-10-3-patcher.py tests/refresh-2026-10-3-translations.py .github/workflows/apply-2026-10-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: harden rental review findings for 2026.10.3'
          git push origin HEAD:fix/2026.10.3-review-hardening

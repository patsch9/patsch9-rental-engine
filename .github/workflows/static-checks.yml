name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        if: matrix.php == '8.2'
        shell: bash
        run: |
          find . -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Translation catalogue integrity
        run: python3 tests/check-translations.py
      - name: Reject short legacy identifiers outside migration layer
        shell: bash
        run: |
          matches="$(grep -RInE --include='*.php' --exclude='class-rmwc-legacy-migration.php' '\bclr_' includes patsch9-rental-engine.php || true)"
          if [ -n "$matches" ]; then
            echo "Legacy clr_ identifiers remain outside the migration layer:"
            echo "$matches"
            exit 1
          fi
      - name: Reject retired Accounting Bridge hook
        shell: bash
        run: |
          if grep -RIn --include='*.php' 'wlc_payment_terms_addition' includes patsch9-rental-engine.php; then
            echo "Retired Accounting Bridge hook detected."
            exit 1
          fi

  wordpress-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          exclude-directories: |
            .github
          exclude-files: |
            VERSIONING.md
            DOCUMENTATION.md
            MIGRATION.md

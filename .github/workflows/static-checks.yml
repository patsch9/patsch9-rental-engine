name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        if: matrix.php == '8.2'
        shell: bash
        run: |
          find . -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Translation catalogue integrity
        run: python3 tests/check-translations.py
      - name: English source-language policy
        run: python3 tests/check-source-language.py
      - name: Reject short legacy identifiers outside migration layer
        shell: bash
        run: |
          matches="$(grep -RInE --include='*.php' --exclude='class-rmwc-legacy-migration.php' '\bclr_' includes patsch9-rental-engine.php || true)"
          if [ -n "$matches" ]; then
            echo "Legacy clr_ identifiers remain outside the migration layer:"
            echo "$matches"
            exit 1
          fi
      - name: Reject retired Accounting Bridge hook
        shell: bash
        run: |
          if grep -RIn --include='*.php' 'wlc_payment_terms_addition' includes patsch9-rental-engine.php; then
            echo "Retired Accounting Bridge hook detected."
            exit 1
          fi

  wordpress-plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned wp-env test harness
        shell: bash
        run: npm -g --no-fund install @wordpress/env@11.16.0
      - name: Configure WordPress test environment
        shell: bash
        run: |
          cat > .wp-env.json <<EOF
          {
            "core": null,
            "testsEnvironment": false,
            "port": 8880,
            "mappings": {
              "wp-content/plugins/patsch9-rental-engine": "$PWD"
            }
          }
          EOF
      - name: Start WordPress test environment
        shell: bash
        run: wp-env start --update
      - name: Install Plugin Check and WooCommerce
        shell: bash
        run: |
          wp-env run cli wp plugin install plugin-check --activate
          wp-env run cli wp plugin install woocommerce --activate
          wp-env run cli wp plugin activate patsch9-rental-engine
      - name: WordPress Plugin Check (strict allowlist)
        shell: bash
        run: |
          set +e
          wp-env run cli wp plugin check patsch9-rental-engine \
            --format=json \
            --exclude-files=.distignore,VERSIONING.md,DOCUMENTATION.md,MIGRATION.md,.wp-env.json \
            --exclude-directories=.github \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > plugin-check-results.txt
          status=$?
          set -e

          cat plugin-check-results.txt

          python3 - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path('plugin-check-results.txt')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          findings = []
          current_file = None

          for line in lines:
              if line.startswith('FILE: '):
                  current_file = line[6:]
                  continue
              if line.startswith('['):
                  if current_file is None:
                      print('Plugin Check JSON appeared without a FILE header.', file=sys.stderr)
                      sys.exit(1)
                  try:
                      entries = json.loads(line)
                  except json.JSONDecodeError as exc:
                      print(f'Unable to parse Plugin Check output: {exc}', file=sys.stderr)
                      sys.exit(1)
                  for entry in entries:
                      findings.append((current_file, entry))

          allowed_file = 'includes/class-rmwc-legacy-migration.php'
          allowed_code = 'WordPress.DB.DirectDatabaseQuery.NoCaching'
          unexpected = [
              (file_name, entry)
              for file_name, entry in findings
              if file_name != allowed_file or entry.get('code') != allowed_code
          ]

          if unexpected:
              print('Unexpected Plugin Check findings:', file=sys.stderr)
              for file_name, entry in unexpected:
                  print(f"- {file_name}:{entry.get('line', '?')} {entry.get('type', '?')} {entry.get('code', '?')}: {entry.get('message', '')}", file=sys.stderr)
              sys.exit(1)

          allowed = [
              (file_name, entry)
              for file_name, entry in findings
              if file_name == allowed_file and entry.get('code') == allowed_code
          ]

          if len(allowed) > 2:
              print(f'Expected at most two documented migration NoCaching warnings, found {len(allowed)}.', file=sys.stderr)
              sys.exit(1)

          if allowed:
              print(f'Accepted {len(allowed)} documented one-time migration NoCaching warning(s).')
          else:
              print('Plugin Check completed without findings.')
          PY

          if [ "$status" -ne 0 ] && [ ! -s plugin-check-results.txt ]; then
            echo "Plugin Check exited with status $status without structured findings."
            exit "$status"
          fi

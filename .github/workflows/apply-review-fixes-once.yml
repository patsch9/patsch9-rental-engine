name: Apply review fixes once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate helper syntax
        run: python3 -m py_compile tools/apply-review-fixes.py

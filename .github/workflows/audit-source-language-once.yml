name: Audit remaining source language once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report German source candidates
        run: python3 tools/audit-source-language.py

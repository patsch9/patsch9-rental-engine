name: Apply final review fixes once

on:
  push:
    branches:
      - fix/wordpress-org-rental-review-2026-10-12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply scoped source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('includes/class-rmwc-plugin.php')
          text = plugin.read_text(encoding='utf-8')
          raw_comment = '                /* translators: Literal reminder-template tokens. Keep the tokens unchanged. */\n'
          if raw_comment not in text:
              raise SystemExit('Expected raw translators comment not found')
          text = text.replace(raw_comment, '', 1)

          old = "<?php esc_html_e( 'Placeholders: %name%, %product%, %pickup%, %return%, %order%', 'patsch9-rental-engine' ); ?>"
          new = """<?php
                /* translators: Literal reminder-template tokens. Keep %name%, %product%, %pickup%, %return% and %order% unchanged. */
                esc_html_e( 'Placeholders: %name%, %product%, %pickup%, %return%, %order%', 'patsch9-rental-engine' );
                ?>"""
          if old not in text:
              raise SystemExit('Expected placeholder translation call not found')
          plugin.write_text(text.replace(old, new, 1), encoding='utf-8')

          migration = Path('includes/class-rmwc-legacy-migration.php')
          text = migration.read_text(encoding='utf-8')
          text = text.replace('            // phpcs:disable WordPress.DB.DirectDatabaseQuery.NoCaching\n', '', 1)
          text = text.replace('            // phpcs:enable WordPress.DB.DirectDatabaseQuery.NoCaching\n', '', 1)
          old_ignore = '// phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery -- One-time migration of plugin-owned tables.'
          new_ignore = '// phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery,WordPress.DB.DirectDatabaseQuery.NoCaching -- One-time migration of plugin-owned tables; fresh counts are required for conflict safety.'
          if text.count(old_ignore) < 2:
              raise SystemExit('Expected SELECT migration ignores not found')
          text = text.replace(old_ignore, new_ignore, 2)
          migration.write_text(text, encoding='utf-8')
          PY

          php -l includes/class-rmwc-plugin.php
          php -l includes/class-rmwc-legacy-migration.php
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-rmwc-plugin.php includes/class-rmwc-legacy-migration.php
          git diff --cached --check
          git commit -m "fix: resolve final WordPress Plugin Check findings"
          git push
